- group_config:
    - larasoft-dam-librarian:

       - name: larasoft-dam-librarian
         description: Oversees metadata compliance, approves metadata, maintains taxonomy standards
         isMemberOf: dam-users, workflow-editors
         path: /home/groups/larasoft
         
    - larasoft-creative-teams:

       - name: larasoft-creative-teams
         description: Produces and uploads new assets to the folder
         isMemberOf: dam-users
         path: /home/groups/larasoft

    - larasoft-asset-collaborators:

       - name: larasoft-asset-collaborators
         description: Collaborates on assets (edits, moves, renames, provides input)
         isMemberOf: dam-users
         path: /home/groups/larasoft

    - larasoft-asset-approvers:

       - name: larasoft-asset-approvers
         description: Final approval for production use (quality, compliance)
         isMemberOf: dam-users
         path: /home/groups/larasoft

    - editor-spanish:

       - name: editor-spanish
         description: Spanish content editors - can edit and publish (only approved) Spanish content under /content/larasoft/es
         isMemberOf: contributor,workflow-users
         path: /home/groups/larasoft

    - reviewer-spanish:

       - name: reviewer-spanish
         description: Spanish content reviewers - can review, approve, reject Spanish content but cannot edit or publish
         isMemberOf: content-authors,workflow-users
         path: /home/groups/larasoft

- user_config:

    - conf-write-service-user:

       - name: conf-write-service-user
         description: System user for Dynamic Media Config update
         isSystemUser: True
         path: /home/users/system/larasoft

    - internal-content:

       - name: internal-content
         description: System user created to read content paths using a service session 
         isSystemUser: True
         path: /home/users/system/larasoft

    - spanish-editor-test:

       - name: spanish-editor-test
         description: Test user for Spanish content editor role
         password: new4you
         path: /home/users/larasoft
         isMemberOf: editor-spanish

    - spanish-reviewer-test:

       - name: spanish-reviewer-test
         description: Test user for Spanish content reviewer role
         password: new4you
         path: /home/users/larasoft
         isMemberOf: reviewer-spanish
         

- ace_config:

    - larasoft-dam-librarian:

       - path: /content/dam/larasoft
         permission: allow
         privileges: jcr:read,jcr:write,jcr:removeNode,jcr:versionManagement,jcr:lockManagement,jcr:modifyProperties,crx:replicate

    - larasoft-creative-teams:

       - path: /content/dam/larasoft/new
         permission: allow
         privileges: jcr:read,jcr:write,jcr:removeNode,jcr:versionManagement,jcr:lockManagement,jcr:modifyProperties

    - larasoft-asset-collaborators:

       - path: /content/dam/larasoft
         permission: allow
         privileges: jcr:read,jcr:write,jcr:versionManagement,jcr:lockManagement,jcr:modifyProperties

    - larasoft-asset-approvers:

       - path: /content/dam/larasoft
         permission: allow
         privileges: jcr:read,jcr:write,crx:replicate

    - editor-spanish:

      # Explicitly deny replicate on language masters
       - path: /content/larasoft/language-masters/en
         permission: deny
         privileges: crx:replicate

       # Allow read/write/replicate access to Spanish content
       # Note: Replicate is allowed but WorkflowEnforcementService will only permit publishing of APPROVED content
       - path: /content/larasoft/es
         permission: allow
         privileges: jcr:read,jcr:write,jcr:removeNode,jcr:versionManagement,jcr:lockManagement,jcr:modifyProperties,crx:replicate
         
       # Allow read/write access to English language masters (but NO publish/replicate)
       - path: /content/larasoft/language-masters/en
         permission: allow
         privileges: jcr:read,jcr:write,jcr:removeNode,jcr:versionManagement,jcr:lockManagement,jcr:modifyProperties
 
       # Allow workflow participation
       - path: /var/workflow
         permission: allow
         privileges: jcr:read,jcr:write

    - reviewer-spanish:

       # Allow read access to Spanish content
       - path: /content/larasoft/es
         permission: allow
         privileges: jcr:read,jcr:versionManagement
         
       # Deny write/modify/replicate permissions - reviewers only approve, don't edit or publish
       - path: /content/larasoft/es
         permission: deny
         privileges: jcr:write,jcr:removeNode,jcr:lockManagement,jcr:modifyProperties,crx:replicate
         
       # Allow workflow participation for review and approval
       - path: /var/workflow
         permission: allow
         privileges: jcr:read,jcr:write